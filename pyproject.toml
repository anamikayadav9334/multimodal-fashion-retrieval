[project]
name = "fashion-retrieval"
version = "0.1.0"
description = "Multimodal Fashion & Context Retrieval: region-aware, compositional text-to-image search for fashion."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 1: dataset sourcing
data = ["kaggle>=1.6", "six"]
# Models + vector store, shared by indexer and retriever
ml = [
    "torch>=2.3",
    "torchvision",
    "open_clip_torch>=2.26",   # Marqo-FashionSigLIP + baseline CLIP
    "transformers>=4.56",      # YOLOS-Fashionpedia detector, Florence-2 captioner
    "timm",
    "einops",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",       # k-means for garment colors
    "scikit-image>=0.22",      # LAB conversion + CIEDE2000
    "sentence-transformers>=3.0",  # bge-small caption/query text embeddings
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_retrieval"]
