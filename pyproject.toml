[project]
name = "fashion-retrieval"
version = "0.1.0"
description = "Multimodal Fashion & Context Retrieval: region-aware, compositional text-to-image search for fashion."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 1: dataset sourcing
data = ["kaggle>=1.6", "six"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_retrieval"]
